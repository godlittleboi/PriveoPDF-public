[project]
name = "pdf-modificator"
version = "0.1.0"
description = "Local desktop PDF application; cleaned source-review snapshot."
readme = "README.md"
license = "LicenseRef-PriveoPDF-Source-Available-1.0"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.0",
  "packaging>=24",
  "pikepdf>=10.9.0",
  "Pillow>=12.3.0",
  "PySide6>=6.7",
]

[project.scripts]
pdfmod = "pdfmod.app.main:main"

[dependency-groups]
dev = [
  "bandit[toml]>=1.8.6",
  "cyclonedx-bom>=7.1.0",
  "detect-secrets>=1.5.0",
  "pip-audit>=2.9.0",
  "mkdocs==1.6.1",
  "pyright>=1.1.410",
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfmod"]

[tool.hatch.build.targets.wheel.force-include]
"docs/wiki" = "pdfmod/assets/wiki"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "PERF", "RUF", "PTH", "C4"]
ignore = ["RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S314", "S603", "S607"]
"src/pdfmod/ui/options_dialog.py" = ["I001"] # Existing canonical import-order debt only.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
